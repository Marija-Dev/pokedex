<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>

    <link rel="stylesheet" href="./style.css">
    <link rel="icon" href="./loading-spinner.png">

    <script src="./template.js" defer></script>
    <script src="./script.js" defer></script>
</head>

<body onload="init()">
    <header>
        <div class="fullwidth-header">
            <div class="header-content">
                <h1 class="header-text">Pokedex</h1>

                <div class="find-pokemon-con">
                    <input id="inputField" class="input" type="search" placeholder="Find pokemon (min 3 chars)">
                    <button onclick="findPokemon()" class="find-pokemon-btn">Go!</button>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div id="spinnerCon" class="spinner-con">
            <div id="loadingSpinner" class="loading-spinner hidden">
                <img class="spinner-img" src="./loading-spinner.png" alt="Loading spinner">
            </div>
        </div>

        <div id="thumbCon" class="thumb-container">
            <ul>
                <li id="singlePokeCard">

                </li>
            </ul>

            <div id="pokemonResultsContainer" class="results-container">

            </div>
        </div>

        <div id="loadMoreCon" class="load-more-con">

        </div>

        <dialog id="singlePokemonDialog" aria-label="dialog" class="dialog" closedby="any">

        </dialog>
    </main>

    <footer>
        <p class="footer-text">Created by Marija Galiot 2026</p>
    </footer>
</body>

</html>
